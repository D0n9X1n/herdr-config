name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q zsh shellcheck jq
      # Tests keep fixtures under /private/tmp/apollo-test.* (the macOS path); Linux has no /private.
      - name: Temp base
        run: sudo mkdir -p /private/tmp && sudo chmod 1777 /private/tmp
      - name: JSON and node --check
        run: scripts/check.sh json
      - name: npm test
        run: npm test
      - name: Repo checks that don't need Herdr
        run: scripts/check.sh theme settings user keys ctx refresh shared gallery cleanroom gitignore files shots docs wiki privacy
      - name: safe-rm, live (fake home) and in-clone tests, in a temp clone
        run: |
          scripts/in-clone.sh bash test/safe-rm.test.sh
          scripts/in-clone.sh bash test/live.test.sh
          scripts/in-clone.sh bash test/in-clone.test.sh
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x -P SCRIPTDIR -S warning
